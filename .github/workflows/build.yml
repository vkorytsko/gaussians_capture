name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          xcodebuild -list -project GaussiansCapture.xcodeproj

      # Unsigned: the sideload tool on Windows signs it with the user's Apple ID at install time.
      - name: Build
        run: |
          xcodebuild build \
            -project GaussiansCapture.xcodeproj \
            -scheme GaussiansCapture \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GaussiansCapture.app Payload/
          zip -qry GaussiansCapture.ipa Payload
          ls -l GaussiansCapture.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: GaussiansCapture.ipa

      # A rolling "latest" release, so Windows can fetch the .ipa without a token (public repo).
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "latest build" --notes "Rolling build from main." --prerelease
          gh release upload latest GaussiansCapture.ipa --clobber

  # Unit and UI tests on the iOS simulator, fed by synthetic frames. Must pass.
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          cat > "$RUNNER_TEMP/pick_simulator.py" <<'EOF'
          import json, re, subprocess

          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "--json"]))

          def version(name):
              m = re.search(r"iOS[- ](\d+)[-.](\d+)", name)
              return (int(m.group(1)), int(m.group(2))) if m else None

          devices = simctl("devices", "available")["devices"]
          for runtime in sorted((k for k in devices if version(k)), key=version, reverse=True):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"])
                  raise SystemExit
          runtimes = [r for r in simctl("runtimes", "available")["runtimes"] if version(r["identifier"])]
          types = [t for t in simctl("devicetypes")["devicetypes"] if t["name"].startswith("iPhone")]
          if not runtimes or not types:
              raise SystemExit("no iOS simulator runtime or iPhone device type on this runner")
          runtimes.sort(key=lambda r: version(r["identifier"]))
          udid = subprocess.check_output(["xcrun", "simctl", "create", "ci-iphone",
                                          types[-1]["identifier"], runtimes[-1]["identifier"]])
          print(udid.decode().strip())
          EOF
          xcrun simctl list devices available
          UDID=$(python3 "$RUNNER_TEMP/pick_simulator.py")
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # TEST_RUNNER_ variables reach the test process with the prefix removed.
      - name: Test
        env:
          TEST_RUNNER_GC_ARTIFACT_DIR: ${{ github.workspace }}/out/artifacts
        run: |
          set -o pipefail
          mkdir -p out/artifacts
          xcodebuild test \
            -project GaussiansCapture.xcodeproj \
            -scheme GaussiansCapture \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath out/tests.xcresult \
            -parallel-testing-enabled NO \
            2>&1 | tee out/test.log

      # Falls back to the simulator's own temporary directories if the variable did not reach the tests.
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out/artifacts
          data="$HOME/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }}/data"
          for name in replay-take screens; do
            if [ ! -d "out/artifacts/$name" ]; then
              found=$(find "$data" -type d -path "*gc-artifacts/$name" 2>/dev/null | head -1)
              if [ -n "$found" ]; then cp -R "$found" "out/artifacts/$name"; fi
            fi
          done
          find out/artifacts -type f | sort | head -200

      - name: Upload the replay take
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-take
          path: out/artifacts/replay-take
          if-no-files-found: error

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-screens
          path: out/artifacts/screens
          if-no-files-found: warn

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            out/tests.xcresult
            out/test.log
          if-no-files-found: warn

  # A planted fault the slow-writer test must catch: a pool that never runs out. This job is green
  # only when that test fails under the plant; red means the test cannot see a source that skips
  # back-pressure, or the plant never ran.
  plant-unbounded-pool:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          cat > "$RUNNER_TEMP/pick_simulator.py" <<'EOF'
          import json, re, subprocess

          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *args, "--json"]))

          def version(name):
              m = re.search(r"iOS[- ](\d+)[-.](\d+)", name)
              return (int(m.group(1)), int(m.group(2))) if m else None

          devices = simctl("devices", "available")["devices"]
          for runtime in sorted((k for k in devices if version(k)), key=version, reverse=True):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"])
                  raise SystemExit
          runtimes = [r for r in simctl("runtimes", "available")["runtimes"] if version(r["identifier"])]
          types = [t for t in simctl("devicetypes")["devicetypes"] if t["name"].startswith("iPhone")]
          if not runtimes or not types:
              raise SystemExit("no iOS simulator runtime or iPhone device type on this runner")
          runtimes.sort(key=lambda r: version(r["identifier"]))
          udid = subprocess.check_output(["xcrun", "simctl", "create", "ci-iphone",
                                          types[-1]["identifier"], runtimes[-1]["identifier"]])
          print(udid.decode().strip())
          EOF
          UDID=$(python3 "$RUNNER_TEMP/pick_simulator.py")
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Slow-writer test with an unbounded pool (must fail)
        run: |
          set +e
          xcodebuild test \
            -project GaussiansCapture.xcodeproj \
            -scheme GaussiansCapture \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -only-testing:GaussiansCaptureTests/ReplayTakeTests/testSlowWriterDropsAreCountedAndIndicesStayGapless \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG PLANT_UNBOUNDED_POOL' \
            2>&1 | tee plant.log
          status=${PIPESTATUS[0]}
          if grep -qiE "test ?case .*testSlowWriterDropsAreCountedAndIndicesStayGapless.*failed" plant.log; then
            echo "::notice::Plant caught: the slow-writer test failed with an unbounded pool, as it must."
            exit 0
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error::Plant NOT caught: the slow-writer test passed with an unbounded pool."
            exit 1
          fi
          echo "::error::The plant never ran, or its failure line did not match: xcodebuild exit $status."
          exit 2
